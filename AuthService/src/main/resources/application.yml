server:
  port: 8085

spring:
  application:
    name: AuthService
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_management_auth_service
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ClinicManagementSuperSecretKeyForJWTAuthTokenGeneration2026Secure
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html