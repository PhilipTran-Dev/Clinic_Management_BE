server:
  port: 8083

spring:
  application:
    name: ClinicalConsultationService
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_management_clinicalconsultation_service
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  patient-intake:
    base-url: http://localhost:8082/api/v1/queue

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html